name: Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  secrets:
    if: ${{ !github.event.pull_request.draft }}
    uses: victor-software-house/actions/.github/workflows/secrets.yml@444c20944bb46cf90583931dbfb5678227dff774 # main, 2026-10-24
    with:
      mise-version: 2026.10.17
