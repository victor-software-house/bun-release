name: Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  secrets:
    permissions:
      contents: read
      # The mise action exchanges it for the mirror's session token.
      id-token: write
    if: ${{ !github.event.pull_request.draft }}
    uses: victor-software-house/actions/.github/workflows/secrets.yml@4168002fe58fd0b310bd2b65f9db2262fc0e21d3 # main, 2026-11-11
    with:
      mise-version: 2026.11.6
    secrets:
      RELEASE_MIRROR_URL: ${{ secrets.RELEASE_MIRROR_URL }}
      RELEASE_MIRROR_CI_KEY: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
